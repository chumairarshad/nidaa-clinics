<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | NiDAA Clinic Lahore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      text-align: center;
      padding: 2rem;
      margin: 0;
    }
    .error-card {
      max-width: 520px;
      background: #FFFFFF;
      padding: 3.5rem 2.5rem;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      border: 1px solid #E2E8F0;
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      color: #C4161C;
      line-height: 1;
      margin: 0 0 1rem;
    }
    .error-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 0.75rem;
    }
    .error-desc {
      color: #64748B;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      background: #C4161C;
      color: #FFFFFF;
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .btn-home:hover {
      background: #A01217;
      transform: translateY(-2px);
    }
    .btn-wa {
      display: inline-flex;
      align-items: center;
      background: #25D366;
      color: #FFFFFF;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .btn-wa:hover {
      background: #1DA851;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <a href="index.html" style="display:inline-block; margin-bottom:1.5rem;">
      <img src="assets/images/logo.png" alt="NiDAA Clinic Lahore" style="height:48px; width:auto;">
    </a>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      The page you are looking for does not exist or has been moved. You can return to our homepage or reach out directly to our 24/7 care helpline.
    </p>
    <div class="error-actions">
      <a href="index.html" class="btn-home">← Back to Homepage</a>
      <a href="https://wa.me/923217507866?text=Hello%20NiDAA%20Clinic,%20I%20need%20assistance." target="_blank" rel="noopener noreferrer" class="btn-wa">WhatsApp Helpline</a>
    </div>
  </div>
</body>
</html>
